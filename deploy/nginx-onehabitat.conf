# Merge into /etc/nginx/sites-available/onehabitat.in (inside the server { } block).
# Default nginx limit is 1MB, which causes 413 on phone photo uploads.

server {
    listen 443 ssl http2;
    server_name onehabitat.in www.onehabitat.in;

    # 0 = no upload size limit. Use e.g. 100m if you prefer a cap.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow long-running AI analysis for large uploads.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
